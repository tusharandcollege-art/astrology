<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>अपॉइंटमेंट बुकिंग | Acharya Arvind</title>
<meta name="description" content="आचार्य अरविंद जी से सीधी बात या कॉल शेड्यूल करें।">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-cream:    #FAF7F2;
  --bg-white:    #FFFFFF;
  --maroon:      #7A1515;
  --maroon-dark: #5C0E0E;
  --maroon-light:rgba(122, 21, 21, 0.05);
  --gold:        #C59B27;
  --gold-dark:   #9E7B1A;
  --gold-light:  #DFBE6B;
  --gold-bg:     rgba(197, 155, 39, 0.08);
  --text-dark:   #2C1808;
  --text-mid:    #5E4329;
  --text-muted:  #8E7356;
  --border-gold: #E6D5B8;
  --border-light:rgba(230, 213, 184, 0.6);
  --fh: 'Noto Sans Devanagari', sans-serif;
  --fe: 'Inter', sans-serif;
  --fs: 'Cinzel', serif;
  --shadow-md: 0 10px 30px rgba(0,0,0,0.06);
  --tr: all .25s ease;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box }
html, body { height:100%; overflow:hidden }
body { font-family:var(--fe); background:var(--bg-cream); color:var(--text-dark); display:flex; flex-direction:column }
a { text-decoration:none; color:inherit }

/* Compact Single-Screen Navbar */
.navbar {
  height:54px; background:rgba(250, 247, 242, 0.98);
  border-bottom:1px solid var(--border-light);
  padding:0 36px; display:flex; align-items:center; justify-content:space-between;
  flex-shrink:0;
}
.logo { display:flex; align-items:center; gap:10px }
.logo-om { font-family:var(--fh); font-size:1.9rem; color:var(--gold); line-height:1 }
.logo-title { font-family:var(--fh); font-size:1rem; font-weight:800; color:var(--maroon) }

.btn-back-home {
  font-family:var(--fh); font-size:.78rem; font-weight:700;
  color:var(--maroon); border:1px solid var(--border-gold);
  padding:5px 14px; border-radius:20px; background:#FFF; transition:var(--tr);
}
.btn-back-home:hover { background:var(--maroon); color:#FFF }

/* NO-SCROLL VIEWPORT WRAPPER */
.viewport-body {
  flex:1; display:flex; align-items:center; justify-content:center;
  padding:14px 20px; height:calc(100vh - 54px); box-sizing:border-box;
}

.booking-grid {
  display:grid; grid-template-columns:36% 61%; gap:3%;
  width:100%; max-width:1100px; height:100%; max-height:540px;
  align-items:stretch;
}

/* Left Column: Instant Connect Options */
.left-card {
  background:#FFFFFF; border:1px solid var(--border-gold);
  border-radius:20px; padding:22px; box-shadow:var(--shadow-md);
  display:flex; flex-direction:column; justify-content:space-between;
}
.hdr-group .tag { font-family:var(--fs); font-size:.65rem; letter-spacing:2px; color:var(--gold); font-weight:700; text-transform:uppercase; margin-bottom:4px }
.hdr-group h1 { font-family:var(--fh); font-size:1.45rem; font-weight:900; color:var(--maroon); line-height:1.2; margin-bottom:6px }
.hdr-group p { font-family:var(--fh); font-size:.8rem; color:var(--text-muted); line-height:1.4 }

.direct-btns { display:flex; flex-direction:column; gap:10px; margin:14px 0 }
.btn-direct-phone {
  background:var(--maroon); color:#FFF; padding:12px 16px; border-radius:12px;
  display:flex; align-items:center; gap:12px; font-family:var(--fh); font-size:.85rem; font-weight:700;
  box-shadow:0 4px 14px rgba(122, 21, 21, 0.2); transition:var(--tr);
}
.btn-direct-phone:hover { background:var(--maroon-dark); transform:translateY(-1px) }

.btn-direct-wa {
  background:#25D366; color:#FFF; padding:12px 16px; border-radius:12px;
  display:flex; align-items:center; gap:12px; font-family:var(--fh); font-size:.85rem; font-weight:700;
  box-shadow:0 4px 14px rgba(37, 211, 102, 0.25); transition:var(--tr);
}
.btn-direct-wa:hover { background:#1EBE5D; transform:translateY(-1px) }

.trust-pills { display:grid; grid-template-columns:1fr 1fr; gap:6px; background:var(--bg-cream); padding:8px 12px; border-radius:12px; border:1px solid var(--border-light) }
.trust-item { display:flex; align-items:center; gap:6px; font-family:var(--fh); font-size:.72rem; font-weight:700; color:var(--text-dark) }
.trust-item span { color:var(--gold) }

/* Right Column: Fast Easy Scheduler Form */
.form-card {
  background:#FFFFFF; border:1px solid var(--border-gold);
  border-radius:20px; padding:22px 26px; box-shadow:var(--shadow-md);
  display:flex; flex-direction:column; justify-content:space-between;
}
.form-title { font-family:var(--fh); font-size:1.05rem; font-weight:800; color:var(--maroon); margin-bottom:12px; display:flex; align-items:center; gap:8px }

.f-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:10px }
.f-grp { display:flex; flex-direction:column; gap:4px }
.f-grp label { font-family:var(--fh); font-size:.75rem; font-weight:700; color:var(--text-dark) }
.f-grp input, .f-grp select {
  font-family:var(--fh); font-size:.82rem; padding:9px 12px;
  border:1px solid var(--border-gold); border-radius:8px;
  background:var(--bg-cream); outline:none; transition:var(--tr);
}
.f-grp input:focus, .f-grp select:focus { border-color:var(--gold); background:#FFF }

/* Easy Time Slot Selection Chips */
.slots-lbl { font-family:var(--fh); font-size:.75rem; font-weight:700; color:var(--text-dark); margin:4px 0; display:block }
.mini-slots { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:12px }
.slot-chip {
  background:var(--bg-cream); border:1px solid var(--border-gold);
  border-radius:8px; padding:7px 8px; text-align:center; cursor:pointer;
  font-family:var(--fe); font-size:.78rem; font-weight:700; color:var(--text-dark); transition:var(--tr);
}
.slot-chip.selected, .slot-chip:hover { background:var(--maroon); border-color:var(--maroon); color:#FFF }

/* Submit Button */
.btn-submit-sch {
  font-family:var(--fh); font-size:.95rem; font-weight:800;
  background:var(--maroon); color:#FFF; border:none; padding:13px;
  border-radius:10px; cursor:pointer; transition:var(--tr); width:100%;
  box-shadow:0 4px 14px rgba(122, 21, 21, 0.2);
}
.btn-submit-sch:hover { background:var(--maroon-dark) }

/* Confirmation Banner Box */
.confirm-box {
  display:none; background:#F0FDF4; border:1.5px solid #22C55E;
  border-radius:12px; padding:16px; text-align:center; margin-top:10px;
}
.confirm-box.active { display:block }
.confirm-title { font-family:var(--fh); font-size:1.05rem; font-weight:800; color:#15803D; margin-bottom:4px }
.confirm-desc { font-family:var(--fh); font-size:.78rem; color:#166534; line-height:1.4 }

/* Floating WhatsApp FAB */
.chat-fab {
  position:fixed; bottom:20px; right:20px;
  width:48px; height:48px; background:#25D366; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  color:#FFF; box-shadow:0 4px 20px rgba(37, 211, 102, 0.4);
  z-index:999; text-decoration:none; transition:var(--tr);
}
.chat-fab:hover { transform:scale(1.08) }

/* Responsive */
@media(max-width:850px) {
  html, body { height:auto; overflow:auto }
  .viewport-body { height:auto; padding:16px }
  .booking-grid { grid-template-columns:1fr; height:auto; max-height:none }
}
</style>
</head>
<body>

<!-- Viewport No-Scroll Container -->
<div class="viewport-body">
  <div class="booking-grid">

    <!-- LEFT COLUMN: Instant Connect -->
    <div class="left-card">
      <div class="hdr-group">

      </div>

<script>
document.getElementById('sDate').valueAsDate = new Date();

function toggleOtherProblem(sel) {
  var mGrp = document.getElementById('manualProbGrp');
  if(sel.value === 'Other') {
    mGrp.style.display = 'flex';
  } else {
    mGrp.style.display = 'none';
  }
}

var selectedSlotTime = '09:30 AM - 10:30 AM';
function selectSlot(el, slot) {
  document.querySelectorAll('.slot-chip').forEach(function(c){ c.classList.remove('selected'); });
  el.classList.add('selected');
  selectedSlotTime = slot;
}

document.getElementById('schForm').addEventListener('submit', function(e){
  e.preventDefault();
  var name = document.getElementById('sName').value;
  var phone = document.getElementById('sPhone').value;
  var date = document.getElementById('sDate').value;
  var topic = document.getElementById('sTopic').value;
  if(topic === 'Other') {
    topic = document.getElementById('sManualTopic').value || 'अन्य समस्या';
  }

  var bookings = JSON.parse(localStorage.getItem('scheduled_calls') || '[]');
  bookings.push({ name: name, phone: phone, date: date, slot: selectedSlotTime, topic: topic, bookedAt: new Date().toLocaleString() });
  localStorage.setItem('scheduled_calls', JSON.stringify(bookings));

  document.getElementById('schForm').style.display = 'none';
  document.getElementById('cDesc').innerHTML = '<strong>' + name + ' जी</strong>, आपकी कॉल <strong>' + date + '</strong> समय <strong>' + selectedSlotTime + '</strong> पर कन्फर्म हो गई है। विषय: <strong>' + topic + '</strong>।';
  document.getElementById('cBox').classList.add('active');
});
</script>
